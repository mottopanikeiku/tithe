models:
  base:
    model_id: Qwen/Qwen2.5-1.5B
    tokenizer_id: Qwen/Qwen2.5-1.5B
    dtype: auto
    device: auto
  instruct:
    model_id: Qwen/Qwen2.5-1.5B-Instruct
    tokenizer_id: Qwen/Qwen2.5-1.5B-Instruct
    dtype: auto
    device: auto

dataset:
  path: data/processed/truthfulqa_binary.jsonl
  seed: 20260420
  variant: binary_best_vs_best_incorrect

scoring:
  primary_protocol: shared_plain_ab_label
  sensitivity_protocol: native_prompt_ab_label
  protocols:
    - shared_plain_ab_label
    - native_prompt_ab_label

analysis:
  bootstrap_iterations: 10000
  confidence_level: 0.95
  ece_bins: 10
  binning: equal_frequency
  bootstrap_seed: 20260420

