[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alignmenttax"
version = "0.1.0"
description = "TruthfulQA honesty and calibration experiments for matched base/instruct language models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "torch>=2.1",
    "transformers>=4.37",
]

[project.scripts]
alignmenttax = "alignmenttax.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

